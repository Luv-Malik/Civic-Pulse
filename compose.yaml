services:
  db:
    image: postgres:16-alpine
    container_name: civicpulse-db
    environment:
      POSTGRES_DB: civicpulse
      POSTGRES_USER: civicpulse
      POSTGRES_PASSWORD: civicpulse_dev_password
    ports:
      - "5432:5432"
    volumes:
      - civicpulse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicpulse -d civicpulse"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  civicpulse_data:
